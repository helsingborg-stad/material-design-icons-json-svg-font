name: Sync upstream fonts and publish

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      retry_publish:
        description: Retry publishing the latest tag after a failed registry step
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@helsingborg-stad'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        if: ${{ !inputs.retry_publish }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge composer
          python -m pip install -r requirements.txt

      - name: Fetch upstream font files
        if: ${{ !inputs.retry_publish }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/google/material-design-icons.git upstream
          git -C upstream sparse-checkout set variablefont
          git -C upstream rev-parse HEAD > /tmp/material-icons-source-commit

      - name: Check whether source fonts changed
        id: upstream
        if: ${{ !inputs.retry_publish }}
        run: |
          if ! git tag -l 'v[0-9]*' | grep -q .; then
            echo 'initial=true' >> "$GITHUB_OUTPUT"
          else
            latest_tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -1)"
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$latest_tag")" ]; then
              echo 'local_changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          if python scripts/check_upstream.py upstream metadata.json; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify package
        if: ${{ steps.upstream.outputs.changed == 'true' }}
        run: |
          python scripts/build.py --upstream upstream --output . --source-commit "$(cat /tmp/material-icons-source-commit)"
          python scripts/verify.py .
          composer validate --strict

      - name: Verify consumer pruning
        if: ${{ !inputs.retry_publish }}
        run: |
          php -d zend.assertions=1 -d assert.exception=1 tests/prune.php
          node tests/prune.js

      - name: Check GitHub Packages npm size limit
        if: ${{ steps.upstream.outputs.changed == 'true' || steps.upstream.outputs.initial == 'true' || steps.upstream.outputs.local_changed == 'true' }}
        run: |
          npm pack --dry-run --json --ignore-scripts > /tmp/material-symbols-pack.json
          node -e 'const pack = require("/tmp/material-symbols-pack.json")[0]; console.log(`npm tarball: ${(pack.size / 1000000).toFixed(1)} MB`); if (pack.size >= 256000000) { console.error("GitHub Packages requires an npm tarball smaller than 256 MB"); process.exit(1); }'

      - name: Commit and tag new package version
        id: release
        if: ${{ steps.upstream.outputs.changed == 'true' || steps.upstream.outputs.initial == 'true' || steps.upstream.outputs.local_changed == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version="$(python scripts/bump_version.py)"
          if [ "${{ steps.upstream.outputs.changed }}" = 'true' ] || [ "${{ steps.upstream.outputs.local_changed }}" = 'true' ]; then
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Release material icon package ($version)"
            fi
          fi
          git tag "v$version"
          git push --atomic origin HEAD:main "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Select existing release for retry
        id: retry
        if: ${{ inputs.retry_publish }}
        run: |
          tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -1)"
          test -n "$tag"
          git checkout "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        if: ${{ steps.release.outputs.publish == 'true' || steps.retry.outputs.publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@helsingborg-stad/material-design-icons-json-svg-font@$version" version --registry=https://npm.pkg.github.com --json >/dev/null 2>&1; then
            echo "GitHub Packages version $version already exists"
          else
            npm publish
          fi

      - name: Publish GitHub release
        if: ${{ steps.release.outputs.publish == 'true' || steps.retry.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version || steps.retry.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes "Generated from Google Material font commit $(python -c 'import json; print(json.load(open("metadata.json"))["sourceCommit"])')."
          fi
